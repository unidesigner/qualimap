name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (lint, tests, catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - run: ruff check pipeline
      - run: qm catalog validate
      - run: pytest pipeline
      # Synthetic release in the production layout, used by the JS tests below.
      - run: qm demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-release
          path: .qm/pub
          include-hidden-files: true
          retention-days: 3

  web:
    name: Layers, viewer and web app
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: demo-release
          path: .qm/pub
      - run: npm ci
      - run: npm test
      - run: npm run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 3
