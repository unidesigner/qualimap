name: pipeline

# Scheduled run (SPEC §7.6): fetch due sources, rebuild what changed, export and publish a new
# release. `qm run` exits 3 when nothing is due, which counts as success here.
on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: "due (only due sources) or all"
        default: due
        type: choice
        options: [due, all]
      until:
        description: "Stop after this step"
        default: publish
        type: choice
        options: [stage, cells, compute, export, publish]
      force:
        description: "Rebuild even if inputs are unchanged"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qualimap-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    env:
      QM_S3_ENDPOINT: ${{ vars.QM_S3_ENDPOINT }}
      QM_S3_REGION: ${{ vars.QM_S3_REGION }}
      QM_BUCKET_DATA: ${{ vars.QM_BUCKET_DATA }}
      QM_BUCKET_PUB: ${{ vars.QM_BUCKET_PUB }}
      QM_PUBLIC_BASE_URL: ${{ vars.QM_PUBLIC_BASE_URL }}
      QM_VIEWER_ORIGINS: ${{ vars.QM_VIEWER_ORIGINS }}
      QM_S3_KEY_ID: ${{ secrets.QM_S3_KEY_ID }}
      QM_S3_SECRET: ${{ secrets.QM_S3_SECRET }}
      QM_ALERT_WEBHOOK: ${{ secrets.QM_ALERT_WEBHOOK }}
      # Upstream locations interpolated into catalog/indicators.yaml
      QM_GWR_URL: ${{ vars.QM_GWR_URL }}
      QM_STATPOP_URL: ${{ vars.QM_STATPOP_URL }}
      QM_STATPOP_POP_COLUMN: ${{ vars.QM_STATPOP_POP_COLUMN }}
      QM_NOLC04_URL: ${{ vars.QM_NOLC04_URL }}
      QM_NOLC04_CODE_COLUMN: ${{ vars.QM_NOLC04_CODE_COLUMN }}
      QM_COMMUNE_REGISTER_URL: ${{ vars.QM_COMMUNE_REGISTER_URL }}
      QM_GTFS_URL: ${{ vars.QM_GTFS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[all]"
      - run: echo "QM_CACHE_DIR=$RUNNER_TEMP/qm-cache" >> "$GITHUB_ENV"
      - name: Doctor
        run: qm doctor
      - name: Run
        run: |
          set +e
          flags="--${{ inputs.scope || 'due' }} --until ${{ inputs.until || 'publish' }}"
          if [ "${{ inputs.force }}" = "true" ]; then flags="$flags --force"; fi
          qm --json run $flags | tee run.json
          code=${PIPESTATUS[0]}
          case $code in
            0) echo "published or completed" ;;
            3) echo "nothing due"; code=0 ;;
            2) echo "::error::QA blocked the release (latest.json not switched)" ;;
            *) echo "::error::pipeline failed ($code)" ;;
          esac
          exit $code
      - name: Status
        if: always()
        run: qm status || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record
          path: run.json
          retention-days: 30
