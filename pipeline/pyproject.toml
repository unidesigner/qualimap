[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qualimap"
version = "0.1.0"
description = "Quality-of-life maps on the A5 discrete global grid: pipeline and qm CLI"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
  "pya5>=1.0",
  "duckdb>=1.5.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "scipy>=1.13",
  "zarr>=3.0",
  "httpx>=0.27",
  "fsspec>=2024.6",
  "s3fs>=2024.6",
  "boto3>=1.34",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
osm = ["osmium>=4.0"]
zonal = ["exactextract>=0.2"]
shell = ["ipython>=8"]
analysis = ["xarray>=2024.6", "xdggs>=0.6"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]
all = ["qualimap[osm,zonal,shell,analysis]"]

[project.scripts]
qm = "qualimap.cli:main"

# Third-party fetchers and transforms register under the entry-point groups
# "qualimap.fetchers" and "qualimap.transforms" (see SPEC §7.3).

[tool.hatch.build.targets.wheel]
packages = ["src/qualimap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/qualimap/cli.py" = ["B008"]  # Typer declares options as argument defaults
